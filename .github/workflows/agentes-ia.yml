name: Agentes de melhoria

on:
  schedule:
    # Terça-feira, 10h17 em São Paulo. No máximo uma rodada por semana.
    - cron: '17 13 * * 2'
  workflow_dispatch:
    inputs:
      diagnostico:
        description: Conferir configuração sem chamar IA nem modificar o repositório
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agentes-ia
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      executar: ${{ steps.configuracao.outputs.executar }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fixar a base desta rodada
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Conferir ativação, credencial, fila e rodada anterior
        id: configuracao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PCM_IA_ATIVA: ${{ vars.PCM_IA_ATIVA }}
          PCM_IA_MODELO: ${{ vars.PCM_IA_MODELO }}
          PCM_CHAVE_IA: ${{ secrets.OPENAI_API_KEY }}
          PCM_DIAGNOSTICO: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostico }}
          PCM_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          command -v grep >/dev/null
          motivos=()
          [[ "$PCM_REF" == 'refs/heads/main' ]] || motivos+=('Geração permitida apenas na main.')
          [[ "$PCM_IA_ATIVA" == 'true' ]] || motivos+=('PCM_IA_ATIVA precisa ser true após autorizar consumo e configurar o provedor.')
          [[ -n "$PCM_IA_MODELO" ]] || motivos+=('Defina PCM_IA_MODELO com um modelo autorizado para a chave.')
          [[ -n "$PCM_CHAVE_IA" ]] || motivos+=('Cadastre OPENAI_API_KEY nos secrets do Actions; não envie a chave pelo chat.')
          [[ "$PCM_DIAGNOSTICO" != 'true' ]] || motivos+=('Modo diagnóstico: nenhuma chamada de IA será feita.')
          if ! grep -Eq '\|[[:space:]]*Pronta[[:space:]]*\|' docs/FILA.md; then
            motivos+=('Não há tarefa com situação Pronta em docs/FILA.md.')
          fi
          abertas=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          if grep -Eq '^agentes-ia/' <<< "$abertas"; then
            motivos+=('Já existe uma proposta de agentes aberta; conclua sua revisão primeiro.')
          fi
          if (( ${#motivos[@]} )); then
            echo 'executar=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Rodada não iniciada'
              printf -- '- %s\n' "${motivos[@]}"
              echo ''
              echo 'Diagnóstico concluído sem consumo de IA. Configuração não significa desenvolvimento validado.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'executar=true' >> "$GITHUB_OUTPUT"
            echo 'Configuração conferida. Iniciando uma rodada limitada.' >> "$GITHUB_STEP_SUMMARY"
          fi

  implementar:
    needs: preparar
    if: needs.preparar.outputs.executar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      alterou: ${{ steps.pacote.outputs.alterou }}
    env:
      PCM_BASE_SHA: ${{ needs.preparar.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Preservar o conferidor confiável fora do checkout
        run: cp scripts/agentes-ia.mjs "$RUNNER_TEMP/agentes-ia.mjs"
      - name: Implementar uma tarefa pronta
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          model: ${{ vars.PCM_IA_MODELO }}
          effort: medium
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .github/prompts/implementar.md
          output-file: ${{ runner.temp }}/resposta-implementador.txt
      - name: Conferir escopo e empacotar somente o patch
        id: pacote
        run: |
          alterou=$(node "$RUNNER_TEMP/agentes-ia.mjs" empacotar "$RUNNER_TEMP/candidato.patch")
          echo "alterou=$alterou" >> "$GITHUB_OUTPUT"
          if [[ "$alterou" != 'true' ]]; then
            echo 'Nenhuma alteração candidata produzida; revisão e PR não serão iniciados.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.pacote.outputs.alterou == 'true'
        with:
          name: candidato
          path: ${{ runner.temp }}/candidato.patch
          if-no-files-found: error
          retention-days: 7

  revisar:
    needs: [preparar, implementar]
    if: needs.implementar.outputs.alterou == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PCM_BASE_SHA: ${{ needs.preparar.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidato
          path: ${{ runner.temp }}/candidato
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Preservar o conferidor confiável fora do checkout
        run: cp scripts/agentes-ia.mjs "$RUNNER_TEMP/agentes-ia.mjs"
      - name: Validar e aplicar o patch à base confiável
        run: node "$RUNNER_TEMP/agentes-ia.mjs" aplicar "$RUNNER_TEMP/candidato/candidato.patch"
      - name: Revisar em sessão independente e somente leitura
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          model: ${{ vars.PCM_IA_MODELO }}
          effort: medium
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .github/prompts/revisar.md
          output-file: ${{ runner.temp }}/revisao.json
          output-schema: '{"type":"object","properties":{"aprovado":{"type":"boolean"},"achados":{"type":"array","items":{"type":"string"}}},"required":["aprovado","achados"],"additionalProperties":false}'
      - name: Exigir aprovação sem achados
        run: node "$RUNNER_TEMP/agentes-ia.mjs" conferir-revisao "$RUNNER_TEMP/revisao.json"
      - uses: actions/upload-artifact@v4
        with:
          name: revisao
          path: ${{ runner.temp }}/revisao.json
          if-no-files-found: error
          retention-days: 7

  verificar:
    needs: [preparar, implementar]
    if: needs.implementar.outputs.alterou == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PCM_BASE_SHA: ${{ needs.preparar.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidato
          path: ${{ runner.temp }}/candidato
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Preservar o conferidor confiável fora do checkout
        run: cp scripts/agentes-ia.mjs "$RUNNER_TEMP/agentes-ia.mjs"
      - name: Validar e aplicar o patch
        run: node "$RUNNER_TEMP/agentes-ia.mjs" aplicar "$RUNNER_TEMP/candidato/candidato.patch"
      - run: npm ci
      - run: npm run verificar
      - run: npm ci --prefix ferramentas/navegador
      - run: node ferramentas/navegador/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:navegador

  propor:
    needs: [preparar, implementar, revisar, verificar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      PCM_BASE_SHA: ${{ needs.preparar.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidato
          path: ${{ runner.temp }}/candidato
      - uses: actions/download-artifact@v4
        with:
          name: revisao
          path: ${{ runner.temp }}/revisao
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Preservar o conferidor confiável fora do checkout
        run: cp scripts/agentes-ia.mjs "$RUNNER_TEMP/agentes-ia.mjs"
      - name: Conferir os artefatos sem executar o código candidato
        run: |
          node "$RUNNER_TEMP/agentes-ia.mjs" conferir-revisao "$RUNNER_TEMP/revisao/revisao.json"
          node "$RUNNER_TEMP/agentes-ia.mjs" aplicar "$RUNNER_TEMP/candidato/candidato.patch"
      - name: Criar ramo e proposta em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PCM_EXECUCAO: ${{ github.run_id }}
          PCM_TENTATIVA: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          atual=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          [[ "$atual" == "$PCM_BASE_SHA" ]] || { echo 'A main avançou; gere uma nova rodada sobre a base atual.' >&2; exit 1; }
          ramo="agentes-ia/$PCM_EXECUCAO-$PCM_TENTATIVA"
          git switch -c "$ramo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git -c core.hooksPath=/dev/null commit -m 'Propor uma melhoria delimitada por agentes'
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "$ramo"
          cat > "$RUNNER_TEMP/proposta.md" <<EOF_PR
          ## Antes
          A tarefa pronta descrita na fila ainda não tinha esta proposta de implementação.

          ## Depois
          Uma melhoria delimitada; confira o diff e o registro atualizado em docs/FILA.md.

          ## Como testar
          Código, testes, build e roteiro de navegador passaram em job sem credenciais de IA.
          Houve revisão estática por outra sessão de agente, sem achados.
          Evidências: https://github.com/$GH_REPO/actions/runs/$PCM_EXECUCAO
          O token do Actions não dispara automaticamente checks de PR; o fluxo Verificar e publicar será iniciado explicitamente neste ramo.

          ## Riscos
          Proposta gerada por IA. Este PR permanece em rascunho para conferência do mantenedor.
          Não há integração automática nem publicação pelo agente. Confira compatibilidade, segurança e o conteúdo antes de aprovar.
          EOF_PR
          gh pr create --repo "$GH_REPO" --base main --head "$ramo" --draft --title 'Proposta de melhoria delimitada por agentes' --body-file "$RUNNER_TEMP/proposta.md"
          gh workflow run publicar.yml --repo "$GH_REPO" --ref "$ramo"
