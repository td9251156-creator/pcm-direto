name: Sugerir artigo para a Central de apoio
description: Proponha um assunto ou texto para os guias do app.
title: "[Apoio] "
labels: ["central de apoio"]
body:
  - type: input
    id: assunto
    attributes:
      label: Assunto
      placeholder: "Ex.: como preencher uma ficha de falha"
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por que esse assunto ajuda
      description: Que dúvida ou dificuldade ele resolve no dia a dia da manutenção?
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: Rascunho (opcional)
      description: Artigos têm de 1 a 2 minutos de leitura, um exemplo com a Indústria Exemplo e um passo a passo no app. Sem promessa de conformidade com norma.
