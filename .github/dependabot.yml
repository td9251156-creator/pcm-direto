version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:40'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: Atualizar dependências
  - package-ecosystem: npm
    directory: /ferramentas/navegador
    schedule:
      interval: weekly
      day: monday
      time: '09:50'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: Atualizar ferramenta de teste
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: Atualizar automação
